apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aivisorsandboxes.aivisor.dev
spec:
  group: aivisor.dev
  names:
    kind: AIVisorSandbox
    plural: aivisorsandboxes
    singular: aivisorsandbox
    shortNames:
      - avsb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                template:
                  type: string
                policy:
                  type: object
                env:
                  type: object
                  additionalProperties:
                    type: string
                timeout:
                  type: string
              required:
                - template
            status:
              type: object
              properties:
                phase:
                  type: string
                sandboxId:
                  type: string
                cgroupId:
                  type: integer
                node:
                  type: string
                snapshotRefs:
                  type: array
                  items:
                    type: string
